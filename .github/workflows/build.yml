# Builds CardBrowser for macOS (arm64, x64) and Windows (x64), self-tests each unpacked build on its runner, and makes a
# GitHub pre-release on a v* tag. Linux is not built (not supported yet). No secrets: the only token is the run's own.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt -c constraints.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests

  mac:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, label: arm64 }
          - { runner: macos-15-intel, arch: x86_64, label: x64 }
    env:
      ARCH: ${{ matrix.arch }}
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"   # python.org's universal2 build (macos11 pkg): the app runs on macOS 11+ (minos.py checks)
      - name: Install
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller pytest
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Notices
        run: python packaging/notices.py THIRD-PARTY-NOTICES.txt
      - name: Build
        env:
          CB_TARGET_ARCH: ${{ matrix.arch }}
        run: pyinstaller --noconfirm packaging/CardBrowser.spec
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict dist/CardBrowser.app
          archs=$(lipo -archs dist/CardBrowser.app/Contents/MacOS/CardBrowser)
          echo "archs: $archs"
          test "$archs" = "$ARCH"
          python packaging/minos.py dist/CardBrowser.app   # no binary needs a newer macOS than Info.plist's minimum
      - name: Package
        run: |
          zip="CardBrowser-$(python cardbrowser.py --version)-mac-$LABEL.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/CardBrowser.app "$zip"   # keeps the bundle's links and signature
          du -sh dist/CardBrowser.app
          ls -l "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Self-test the unpacked app
        timeout-minutes: 5
        run: |
          rm -rf "$RUNNER_TEMP/t"
          mkdir -p "$RUNNER_TEMP/t"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/t"
          "$RUNNER_TEMP/t/CardBrowser.app/Contents/MacOS/CardBrowser" --self-test --ci --report "selftest-mac-$LABEL.json"
      - name: Saved data survives a restart
        timeout-minutes: 5
        run: |
          export CARDBROWSER_HOME="$RUNNER_TEMP/persist"
          app="$RUNNER_TEMP/t/CardBrowser.app/Contents/MacOS/CardBrowser"
          "$app" --self-test --persist write
          "$app" --self-test --persist read
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mac-${{ matrix.label }}
          path: |
            ${{ env.ZIP }}
            selftest-mac-${{ matrix.label }}.json
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller pytest
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Notices
        run: python packaging/notices.py THIRD-PARTY-NOTICES.txt
      - name: Build
        run: pyinstaller --noconfirm packaging/CardBrowser.spec   # one folder (onedir): starts faster, fewer antivirus alarms
      - name: Package
        run: |
          $zip = "CardBrowser-$(python cardbrowser.py --version)-windows-x64.zip"
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt dist\CardBrowser\
          Compress-Archive -Path dist\CardBrowser -DestinationPath $zip
          Get-Item $zip | Format-Table Name, Length
          "ZIP=$zip" >> $env:GITHUB_ENV
      - name: Self-test the unpacked app
        timeout-minutes: 5
        run: |
          $t = Join-Path $env:RUNNER_TEMP t
          Expand-Archive $env:ZIP -DestinationPath $t -Force
          $exe = Join-Path $t CardBrowser\CardBrowser.exe
          # a windowed exe has no console: wait for it, then read its report
          $p = Start-Process $exe -ArgumentList '--self-test', '--ci', '--report', 'selftest-win.json' -WorkingDirectory $pwd -Wait -PassThru
          Get-Content selftest-win.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "self-test exit code $($p.ExitCode)"; exit 1 }
      - name: Self-test a downloaded copy
        timeout-minutes: 5
        run: |
          # Explorer marks each file it unzips from a download (Zone.Identifier, ZoneId=3); Expand-Archive does not
          $m = Join-Path $env:RUNNER_TEMP m
          Copy-Item (Join-Path $env:RUNNER_TEMP t\CardBrowser) $m -Recurse
          Get-ChildItem $m -Recurse -File | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          $all = @(Get-ChildItem $m -Recurse -File)       # every file must carry the mark, or this tests nothing
          $n = @($all | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }).Count
          "marked $n of $($all.Count) files"
          if ($n -eq 0 -or $n -ne $all.Count) { Write-Error 'files not marked'; exit 1 }
          $si = [Diagnostics.ProcessStartInfo]::new((Join-Path $m CardBrowser.exe))
          $si.UseShellExecute = $false                   # as after Run anyway (no zone prompt); its output shows here
          $si.WorkingDirectory = $PWD.Path
          '--self-test', '--ci', '--report', 'selftest-win-marked.json' | ForEach-Object { $si.ArgumentList.Add($_) }
          $p = [Diagnostics.Process]::Start($si)
          if (-not $p.WaitForExit(170000)) {             # an error box waits for a click: print it
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $A = [System.Windows.Automation.AutomationElement]
            $A::RootElement.FindAll('Children', [System.Windows.Automation.PropertyCondition]::new($A::ProcessIdProperty, $p.Id)) |
              Where-Object { $_.Current.ClassName -eq '#32770' } |
              ForEach-Object { $_.FindAll('Descendants', [System.Windows.Automation.Condition]::TrueCondition) } | ForEach-Object { $_.Current.Name }
            Stop-Process -Id $p.Id -Force
            Write-Error 'no exit in 170 s'; exit 1
          }
          if ($p.ExitCode -ne 0) { Write-Error "self-test exit code $($p.ExitCode)"; exit 1 }
      - name: Saved data survives a restart
        timeout-minutes: 5
        run: |
          $env:CARDBROWSER_HOME = Join-Path $env:RUNNER_TEMP persist
          $exe = Join-Path $env:RUNNER_TEMP t\CardBrowser\CardBrowser.exe
          foreach ($m in 'write', 'read') {
            $p = Start-Process $exe -ArgumentList '--self-test', '--persist', $m, '--report', "persist-$m.json" -WorkingDirectory $pwd -Wait -PassThru
            Get-Content "persist-$m.json" -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { Write-Error "persist $m exit code $($p.ExitCode)"; exit 1 }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: windows-x64
          path: |
            ${{ env.ZIP }}
            selftest-win.json
          if-no-files-found: error

  release:
    name: Pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is v + VERSION
        run: |
          v=$(python3 cardbrowser.py --version)
          echo "tag $GITHUB_REF_NAME, VERSION $v"
          test "$GITHUB_REF_NAME" = "v$v"
      - name: The live card site has the app hook
        run: |
          site=https://michaeljsr.github.io/TTSCardMaker/
          curl -fsSL --retry 3 "$site" -o index.html
          if grep -io '<meta[^>]*content-security-policy[^>]*>' index.html | grep -v "'unsafe-eval'"; then
            echo "::error::the site's CSP blocks the app's bridge (no 'unsafe-eval')"
            exit 1
          fi
          src=$(grep -o 'src="assets/app\.js?v=[^"]*"' index.html | head -n 1 | cut -d '"' -f 2)
          test -n "$src"
          curl -fsSL --retry 3 "$site$src" -o app.js
          grep -q '"card-dialog"' app.js || { echo "::error::the live site has no card-dialog hook"; exit 1; }
          grep -q '\.cardApp\b' app.js || { echo "::error::the live site has no read-only mode for the app"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          n=$(find . -maxdepth 1 -name 'CardBrowser-*' | wc -l)
          test "$n" -eq 3 || { echo "::error::$n archives, not 3"; exit 1; }
          sha256sum CardBrowser-* selftest-*.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Pre-release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "CardBrowser $GITHUB_REF_NAME" \
            --notes "Unsigned test build for macOS and Windows. The README says how to open it the first time." \
            CardBrowser-* SHA256SUMS.txt selftest-*.json
